name: Validate OliTechs PMS POS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate local print agent syntax
        run: node --check tools/print-agent/server.mjs

      - name: Validate Windows print agent scripts
        shell: pwsh
        run: |
          $files = @(
            'tools/print-agent/run-windows.ps1',
            'tools/print-agent/install-windows.ps1',
            'tools/print-agent/uninstall-windows.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "PowerShell syntax errors in ${file}: $($errors | Out-String)" }
          }

      - name: Build application
        run: npm run build
