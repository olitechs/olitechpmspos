name: Generate Storekeeper migration with Supabase CLI

on:
  push:
    branches:
      - fix/storekeeper-full-stores-workspace
    paths:
      - .github/workflows/generate-storekeeper-migration.yml
      - supabase/templates/storekeeper_full_stores_workspace_access.sql

permissions:
  contents: write

jobs:
  generate-migration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/storekeeper-full-stores-workspace
          fetch-depth: 0

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Generate timestamped migration using Supabase CLI
        shell: bash
        run: |
          supabase migration new storekeeper_full_stores_workspace_access
          migration_file="$(find supabase/migrations -maxdepth 1 -type f -name '*_storekeeper_full_stores_workspace_access.sql' -print -quit)"
          test -n "$migration_file"
          cp supabase/templates/storekeeper_full_stores_workspace_access.sql "$migration_file"
          echo "Generated migration: $migration_file"

      - name: Commit generated migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/*_storekeeper_full_stores_workspace_access.sql
          git commit -m "Add Storekeeper full Stores workspace migration"
          git push origin HEAD:fix/storekeeper-full-stores-workspace
