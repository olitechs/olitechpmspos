name: Generate Storekeeper migration with Supabase CLI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - supabase/templates/storekeeper_full_stores_workspace_access.sql
  push:
    branches:
      - fix/storekeeper-full-stores-workspace
      - fix/storekeeper-authenticated-employee-resolution
    paths:
      - supabase/templates/storekeeper_full_stores_workspace_access.sql

permissions:
  contents: write

jobs:
  generate-migration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Generate timestamped migration using Supabase CLI
        shell: bash
        run: |
          supabase migration new storekeeper_full_stores_workspace_access
          migration_file="$(find supabase/migrations -maxdepth 1 -type f -name '*_storekeeper_full_stores_workspace_access.sql' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          test -n "$migration_file"
          cp supabase/templates/storekeeper_full_stores_workspace_access.sql "$migration_file"
          echo "Generated migration: $migration_file"

      - name: Commit generated migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/*_storekeeper_full_stores_workspace_access.sql
          git commit -m "Add Storekeeper full Stores workspace migration"
          target_branch="${{ github.event.pull_request.head.ref || github.ref_name }}"
          git push origin HEAD:"$target_branch"
