name: Generate employee POS permission migration

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - supabase/templates/employee_pos_permission_membership_fallback.sql
  push:
    branches: [fix/employee-pos-close-shift-permission]
    paths:
      - supabase/templates/employee_pos_permission_membership_fallback.sql

permissions:
  contents: write

jobs:
  generate-migration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - name: Check whether migration is needed
        id: migration
        shell: bash
        run: |
          git fetch origin main
          changed_files="$(git diff --name-only origin/main...HEAD)"
          if printf '%s\\n' "$changed_files" | grep -Fxq "supabase/templates/employee_pos_permission_membership_fallback.sql" && ! printf '%s\\n' "$changed_files" | grep -Eq '^supabase/migrations/.*_employee_pos_permission_membership_fallback\\.sql$'; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Supabase CLI
        if: steps.migration.outputs.needed == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - name: Generate timestamped migration
        if: steps.migration.outputs.needed == 'true'
        shell: bash
        run: |
          supabase migration new employee_pos_permission_membership_fallback
          migration_file="$(find supabase/migrations -maxdepth 1 -type f -name '*_employee_pos_permission_membership_fallback.sql' -print | sort | tail -n 1)"
          test -n "$migration_file"
          cp supabase/templates/employee_pos_permission_membership_fallback.sql "$migration_file"
          test -s "$migration_file"
      - name: Commit generated migration
        if: steps.migration.outputs.needed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/*_employee_pos_permission_membership_fallback.sql
          git commit -m "Fix employee POS permission resolution without property membership"
          target_branch="${{ github.event.pull_request.head.ref || github.ref_name }}"
          git push origin HEAD:"$target_branch"
