name: POS Menu Import SKU Regression

on:
  pull_request:
    paths:
      - "src/services/inventoryService.js"
      - "src/services/posMenuImportContract.test.mjs"
      - "src/components/pos/MenuManager.jsx"
      - "src/components/store/ImportExport.jsx"
      - "supabase/migrations/20261021150000_fix_pos_menu_import_sku_upsert.sql"
      - "supabase/tests/pos_menu_import_sku_regression.sql"
      - "supabase/tests/fixtures/pos_menu_import_sku_setup.sql"
      - "supabase/migrations/20261022180000_phase1_staff_session_expiry_scope.sql"
      - "supabase/tests/phase1_staff_session_security_regression.sql"
      - "supabase/tests/fixtures/phase1_staff_session_schema.sql"
      - "supabase/tests/phase1-staff-session-contract.test.mjs"
      - ".github/workflows/phase1-staff-session-regression.yml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pos-menu-import-sku-regression.yml"
  workflow_dispatch:

jobs:
  isolated-postgres-and-app-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: pos_menu_import_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pos_menu_import_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: pos_menu_import_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create isolated test schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/pos_menu_import_sku_setup.sql
      - name: Apply the candidate migration only to the ephemeral database
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261021150000_fix_pos_menu_import_sku_upsert.sql
      - name: Run duplicate-SKU and tenant-scope regression
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/pos_menu_import_sku_regression.sql
      - name: Create isolated Phase 1 security database
        run: createdb phase1_staff_session_test
      - name: Load Phase 1 minimal isolated fixture
        run: psql "postgres://postgres:postgres@localhost:5432/phase1_staff_session_test" -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/phase1_staff_session_schema.sql
      - name: Apply Phase 1 candidate migration in isolated database
        run: psql "postgres://postgres:postgres@localhost:5432/phase1_staff_session_test" -v ON_ERROR_STOP=1 -f supabase/migrations/20261022180000_phase1_staff_session_expiry_scope.sql
      - name: Run Phase 1 session and tenant security regression
        run: psql "postgres://postgres:postgres@localhost:5432/phase1_staff_session_test" -v ON_ERROR_STOP=1 -f supabase/tests/phase1_staff_session_security_regression.sql
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Lint and design checks
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Architecture and import contract tests
        run: npm run test:architecture
