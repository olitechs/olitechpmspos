name: Build cPanel staging artifact

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpanel-static-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build static site for cPanel
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify frontend Supabase configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::error::Add VITE_SUPABASE_URL under GitHub Actions Variables or Secrets."
            exit 1
          fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Add VITE_SUPABASE_ANON_KEY under GitHub Actions Variables or Secrets."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build application
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Verify deployment files
        run: |
          test -s dist/index.html
          test -s dist/.htaccess || {
            echo "::error::dist/.htaccess is missing. Confirm public/.htaccess is present and copied by Vite."
            exit 1
          }

      - name: Upload cPanel-ready build
        uses: actions/upload-artifact@v4
        with:
          name: olitechs-cpanel-dist-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
