name: Temporary Sentry SDK lockfile preparation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-sentry-sdk-lock.yml

permissions:
  contents: write

jobs:
  prepare-feature-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: feat/official-sentry-node-sdk
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve Sentry SDK and regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile to implementation branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Lock official Sentry Node SDK dependency"
          git push origin HEAD:feat/official-sentry-node-sdk
      - name: Install from lockfile
        run: npm ci --ignore-scripts
      - name: Verify browser and Node Sentry independently
        run: |
          npm run test:sentry:frontend
          npm run test:sentry:node
      - name: Verify Print Agent regression suite
        run: npm run test:print-agent
      - name: Verify frontend production build
        run: npm run build
