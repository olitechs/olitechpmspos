name: Apply POS stock tracking migration

# One-off production change: applies exactly one migration file and verifies it.
# Requires the typed confirmation APPLY-POS-STOCK-TRACKING. Uses the existing
# SUPABASE_DB_URL secret and never prints it. The migration runs with
# --single-transaction, so it lands whole or not at all. Pre-flight and
# verification live in tools/db/*.sql so they can be reviewed without YAML.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type APPLY-POS-STOCK-TRACKING to run this against production"
        required: true
        default: ""

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FILE: supabase/migrations/20261120120000_pos_product_stock_tracking.sql
    steps:
      - uses: actions/checkout@v4

      - name: Require explicit confirmation
        if: ${{ inputs.confirm != 'APPLY-POS-STOCK-TRACKING' }}
        run: |
          echo "::error::Confirmation input must be exactly APPLY-POS-STOCK-TRACKING."
          exit 1

      - name: Show the exact file being applied
        run: |
          set -euo pipefail
          test -f "$FILE"
          sha256sum "$FILE"

      - name: Pre-flight prerequisites (read only)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::Repository secret SUPABASE_DB_URL is not configured."
            exit 1
          fi
          psql --version
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f tools/db/pos-stock-tracking-preflight.sql

      - name: Apply migration in one transaction
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 --single-transaction -f "$FILE"

      - name: Verify column, menu function and grants
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f tools/db/pos-stock-tracking-verification.sql
