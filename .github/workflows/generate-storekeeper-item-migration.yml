name: Generate Storekeeper item master migration with Supabase CLI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - supabase/templates/storekeeper_item_master_variants.sql

permissions:
  contents: write

jobs:
  generate-migration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - name: Generate timestamped migration
        shell: bash
        run: |
          supabase migration new storekeeper_item_master_variants
          migration_file="$(find supabase/migrations -maxdepth 1 -type f -name '*_storekeeper_item_master_variants.sql' -printf '%T@ %p\\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          test -n "$migration_file"
          cp supabase/templates/storekeeper_item_master_variants.sql "$migration_file"
          echo "Generated migration: $migration_file"
      - name: Commit generated migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/*_storekeeper_item_master_variants.sql
          git commit -m "Add Storekeeper item master and variants migration"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
