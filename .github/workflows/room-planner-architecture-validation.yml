name: Temporary Room Planner Architecture Validation
on:
  push:
    branches:
      - feat/room-planner-coastal-linen-redesign
permissions:
  contents: read
jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:architecture
      - run: npx vite build
