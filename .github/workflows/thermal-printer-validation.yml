name: Thermal Printer Validation

on:
  pull_request:
    paths:
      - 'src/services/escposJob.js'
      - 'src/services/escposJob.test.mjs'
      - 'src/services/printerPrintSettings.js'
      - 'src/services/printTemplates.js'
      - 'src/services/printTemplates.test.js'
      - 'src/services/printerService.js'
      - 'src/services/printService.js'
      - 'src/services/printService.thermal.test.mjs'
      - 'src/services/printRoutingService.js'
      - 'src/pages/SettingsPrinters.jsx'
      - 'tools/print-agent/server.mjs'
      - 'tools/print-agent/thermal-output.contract.test.mjs'
      - '.github/workflows/thermal-printer-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint printer implementation and tests
        run: >-
          npx eslint
          src/services/escposJob.js
          src/services/escposJob.test.mjs
          src/services/printerPrintSettings.js
          src/services/printTemplates.js
          src/services/printTemplates.test.js
          src/services/printerService.js
          src/services/printService.js
          src/services/printService.thermal.test.mjs
          src/services/printRoutingService.js
          src/pages/SettingsPrinters.jsx
          tools/print-agent/server.mjs
          tools/print-agent/thermal-output.contract.test.mjs
          --quiet
      - name: Run thermal printer contract tests
        run: >-
          node --test
          src/services/escposJob.test.mjs
          src/services/printTemplates.test.js
          src/services/printService.thermal.test.mjs
          tools/print-agent/thermal-output.contract.test.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Validate local print agent syntax
        run: node --check tools/print-agent/server.mjs
