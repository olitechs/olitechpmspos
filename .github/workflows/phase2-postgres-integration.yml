name: Phase 2 PostgreSQL integration

on:
  pull_request:
    paths:
      - "supabase/migrations/20261101090000_phase2_room_inventory_concurrency.sql"
      - "supabase/tests/**"
      - ".github/workflows/phase2-postgres-integration.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20261101090000_phase2_room_inventory_concurrency.sql"
      - "supabase/tests/**"
      - ".github/workflows/phase2-postgres-integration.yml"

jobs:
  room-inventory:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: pms_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Apply migration and run real multi-session tests
        run: bash supabase/tests/phase2_room_inventory_integration.sh
