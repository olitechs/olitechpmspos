name: Apply and Validate Phase 1 Reservation Registration

on:
  push:
    branches: [main]
    paths:
      - '.github/phase1-reservation-patch-*.b64'
      - '.github/workflows/phase1-apply-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: phase1_reservation_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d phase1_reservation_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: phase1_reservation_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply candidate source patch
        run: |
          cat .github/phase1-reservation-patch-*.b64 | base64 --decode | gzip --decompress > /tmp/phase1-reservation-registration.patch
          git apply --check /tmp/phase1-reservation-registration.patch
          git apply /tmp/phase1-reservation-registration.patch
      - name: Create disposable PostgreSQL baseline
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/phase1_reservation_setup.sql
      - name: Apply Phase 1 migration to disposable PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261104150000_phase1_reservation_registration.sql
      - name: Run database regression tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/phase1_reservation_registration_regression.sql
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Run architecture and reservation contract tests
        run: npm run test:architecture
      - name: Build application
        run: npm run build
      - name: Commit validated Phase 1 changes to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f .github/phase1-reservation-patch-*.b64 .github/workflows/phase1-apply-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(pms): complete reservation registration phase 1"
          git push origin HEAD:main
          echo "Validated commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
