name: Generate POS bugfix migration with Supabase CLI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - supabase/templates/pos_floor_wastage_valuation_fixes.sql
  push:
    branches:
      - fix/pos-floor-wastage-valuation-errors
    paths:
      - supabase/templates/pos_floor_wastage_valuation_fixes.sql

permissions:
  contents: write

jobs:
  generate-migration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - name: Check whether a generated migration is needed
        id: migration
        shell: bash
        run: |
          git fetch origin main
          changed_files="$(git diff --name-only origin/main...HEAD)"
          template_changed=false
          migration_present=false
          if printf '%s\n' "$changed_files" | grep -Fxq "supabase/templates/pos_floor_wastage_valuation_fixes.sql"; then template_changed=true; fi
          if printf '%s\n' "$changed_files" | grep -Eq '^supabase/migrations/.*_pos_floor_wastage_valuation_fixes\.sql$'; then migration_present=true; fi
          if [ "$template_changed" = "true" ] && [ "$migration_present" = "false" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Supabase CLI
        if: steps.migration.outputs.needed == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - name: Generate timestamped migration using Supabase CLI
        if: steps.migration.outputs.needed == 'true'
        shell: bash
        run: |
          supabase migration new pos_floor_wastage_valuation_fixes
          migration_file="$(find supabase/migrations -maxdepth 1 -type f -name '*_pos_floor_wastage_valuation_fixes.sql' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          test -n "$migration_file"
          cp supabase/templates/pos_floor_wastage_valuation_fixes.sql "$migration_file"
          echo "Generated migration: $migration_file"
      - name: Commit generated migration
        if: steps.migration.outputs.needed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/*_pos_floor_wastage_valuation_fixes.sql
          git commit -m "Add POS floor wastage valuation bugfix migration"
          target_branch="${{ github.event.pull_request.head.ref || github.ref_name }}"
          git push origin HEAD:"$target_branch"
