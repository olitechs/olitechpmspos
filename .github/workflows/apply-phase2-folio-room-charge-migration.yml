name: Apply Phase 2 folio and room charge control migration

# One-off production change: applies exactly one migration file and verifies it.
# Requires the typed confirmation APPLY-PHASE2-FOLIO. Uses the existing
# SUPABASE_DB_URL secret and never prints it. The migration runs with
# --single-transaction, so it lands whole or not at all. Pre-flight,
# verification and the numbering probe live in tools/db/*.sql so they can be
# read and reviewed without reading YAML.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type APPLY-PHASE2-FOLIO to run this against production"
        required: true
        default: ""

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FILE: supabase/migrations/20261119120000_phase2_folio_room_charge_control.sql
    steps:
      - uses: actions/checkout@v4

      - name: Require explicit confirmation
        if: ${{ inputs.confirm != 'APPLY-PHASE2-FOLIO' }}
        run: |
          echo "::error::Confirmation input must be exactly APPLY-PHASE2-FOLIO."
          exit 1

      - name: Show the exact file being applied
        run: |
          set -euo pipefail
          test -f "$FILE"
          sha256sum "$FILE"

      - name: Pre-flight prerequisites (read only)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::Repository secret SUPABASE_DB_URL is not configured."
            exit 1
          fi
          psql --version
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f tools/db/phase2-preflight.sql

      - name: Apply migration in one transaction
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 --single-transaction -f "$FILE"

      - name: Verify schema, backfill and open balances
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f tools/db/phase2-verification.sql

      - name: Ticket numbering round trip (rolled back)
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -uo pipefail
          psql "$SUPABASE_DB_URL" -f tools/db/phase2-numbering-probe.sql
