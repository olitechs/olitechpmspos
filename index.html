<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/app-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A3F4A" />
    <meta name="description" content="OliTechs — hospitality operations for front office, restaurant POS, inventory and property management." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet" />
    <title>OliTechs | Hospitality Operations</title>
    <script>
      (function(){try{
        var m=localStorage.getItem("olitech_theme_mode")||"system";
        var d=m==="dark"||(m==="system"&&matchMedia("(prefers-color-scheme: dark)").matches);
        var r=document.documentElement;
        r.setAttribute("data-theme",d?"dark":"light");
        r.classList.toggle("dark",d);
        var meta=document.querySelector('meta[name="theme-color"]');
        if(meta)meta.setAttribute("content",d?"#10171A":"#0A3F4A");
      }catch(e){}})();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
