server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Container health check.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # React Router: serve the SPA entry point for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite's fingerprinted assets can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Always revalidate the HTML entry point so new releases are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
